name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        # Скачиваем gradle-wrapper.jar
        curl -sL -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar
        # Создаём gradlew
        cat > gradlew << 'SCRIPT'
        #!/bin/sh
        exec java -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
          org.gradle.wrapper.GradleWrapperMain "$@"
        SCRIPT
        chmod +x gradlew

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.8'

    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: CommandSpammer-Mod
        path: build/libs/*.jar
        if-no-files-found: error
